<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clarity</title>
  <meta name="description" content="Clarity: what you deserve. The latest cup of water, what was done about it, and whether it worked.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 200'%3E%3Cpath d='M17 60 L25 190 L135 190 L143 60Z' fill='%235A9BBD' fill-opacity='.5'/%3E%3Cpath d='M10 10 L25 190 L135 190 L150 10' fill='none' stroke='%23F7F0F0' stroke-width='14' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap">
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="../assets/mock.css">
  <link rel="stylesheet" href="../assets/a.css">
  <script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js" } }</script>
</head>
<body class="mock-a">
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.5c3.2 4 6 7.4 6 10.6a6 6 0 0 1-12 0C6 10.9 8.8 7.5 12 3.5z"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4.5 16a7.5 7.5 0 1 1 15 0"/><path d="M12 16l3.5-5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
    <symbol id="i-funnel" viewBox="0 0 24 24"><path d="M4 5h16l-6.2 7.6V19l-3.6-1.8v-4.6z"/></symbol>
    <symbol id="i-retest" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></symbol>
    <symbol id="i-ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5a7.5 7.5 0 0 1 6.5 3.8" stroke-width="3.4"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.2-5.7-6.2-11.1a6.2 6.2 0 0 1 12.4 0C18.2 15.3 12 21 12 21z"/><circle cx="12" cy="9.9" r="2.2"/></symbol>
    <symbol id="i-nodes" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="12" cy="17" r="2"/><path d="M7.8 7.3l8.3.5M7.1 8.7l3.8 6.6M16.9 9.7l-3.8 5.6"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M11 3.5l1.7 4.6 4.6 1.7-4.6 1.7L11 16.1l-1.7-4.6-4.6-1.7 4.6-1.7z"/><path d="M18 14.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01" stroke-width="2.6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
  </svg>
  <div class="glow" aria-hidden="true"></div>

  <header class="bar">
    <a class="wordmark" href="./">
      <svg viewBox="0 0 160 200" aria-hidden="true"><path d="M17 60 L25 190 L135 190 L143 60Z" fill="#5A9BBD" fill-opacity=".5"/><path d="M10 10 L25 190 L135 190 L150 10" fill="none" stroke="#F7F0F0" stroke-width="13" stroke-linejoin="round"/></svg>
      Clarity
    </a>
    <span class="spacer"></span>
    <p class="conn" id="conn" data-state="connecting" role="status"><span class="dot"></span><span id="conn-text">Connecting</span></p>
    <nav class="seg" aria-label="Mockups">
      <a href="./" aria-current="page">Mockup A</a>
      <a href="../b/">Mockup B</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="hero" aria-label="The latest cup">
      <div id="hero-inner">
        <div class="hero-copy">
          <p id="site"></p>
          <h1 id="verdict">Connecting</h1>
          <p id="when"></p>
        </div>
        <div class="stage" id="stage">
          <div class="cup-wrap" id="cup" data-hero3d><div id="cup-fallback"></div></div>
          <div class="tags" id="tags"></div>
        </div>
        <a class="more-hint" href="#details" data-glide="details">Full view<svg class="i"><use href="#i-down"/></svg></a>
      </div>
    </section>

    <section class="sheet" id="details" aria-label="Full view">
      <a class="grabber" href="#hero" data-glide="top" aria-label="Back to the cup"></a>
      <header class="sheet-head">
        <h2 id="sheet-site"></h2>
        <p id="sheet-when"></p>
      </header>
      <div class="tiles">
        <article class="tile span2" id="t-tds"><header class="t-head"><svg class="i"><use href="#i-drop"/></svg>Dissolved solids</header><div class="t-body"></div></article>
        <article class="tile" id="t-ph"><header class="t-head"><svg class="i"><use href="#i-gauge"/></svg>Acidity</header><div class="t-body"></div></article>
        <article class="tile" id="t-clear"><header class="t-head"><svg class="i"><use href="#i-eye"/></svg>Transparency</header><div class="t-body"></div></article>
        <article class="tile span2" id="t-choice"><header class="t-head"><svg class="i"><use href="#i-funnel"/></svg>Filter choice<span class="t-meta"></span></header><div class="t-body"></div></article>
        <div id="filter-tiles" class="contents"></div>
        <article class="tile span2" id="t-map"><header class="t-head"><svg class="i"><use href="#i-pin"/></svg>Princeton network
            <ul class="legend"><li><span class="key key-measured"></span>Measured</li><li><span class="key key-sim"></span>Simulated</li><li><span class="key key-published"></span>Published</li></ul></header>
          <div id="map" role="region" aria-label="Map of monitoring sites around Princeton"></div></article>
        <article class="tile span2" id="t-report"><header class="t-head"><svg class="i"><use href="#i-sparkles"/></svg>Investigator<span class="t-meta"></span></header><div class="t-body"></div></article>
        <article class="tile span4" id="t-readings"><header class="t-head"><svg class="i"><use href="#i-list"/></svg>Readings
            <label class="switch"><input type="checkbox" id="show-sim" checked><span class="track"></span>Simulated nodes</label></header>
          <div class="t-body"></div></article>
      </div>
    </section>
  </main>

  <p class="toast" id="toast" role="status" hidden></p>

  <script src="../vendor/leaflet/leaflet.js"></script>
  <script src="../assets/cup.js"></script>
  <script src="../assets/demo.js"></script>
  <script src="../assets/store.js"></script>
  <script src="../assets/orbit.js"></script>
  <script src="../assets/a.js"></script>
  <script src="../assets/mockup.js"></script>
  <script type="module" src="../assets/hero3d.js"></script>
</body>
</html>
