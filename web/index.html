<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapTest Dashboard</title>
  <meta name="description" content="Live water readings, filter decisions and filter life from TapTest nodes around Princeton.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 200'%3E%3Cpath d='M17 60 L25 190 L135 190 L143 60Z' fill='%237FD8C4' fill-opacity='.5'/%3E%3Cpath d='M10 10 L25 190 L135 190 L150 10' fill='none' stroke='%23E6F1EE' stroke-width='14' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>
  <header class="top">
    <a class="wordmark" href="./">
      <svg viewBox="0 0 160 200" aria-hidden="true"><path d="M17 60 L25 190 L135 190 L143 60Z" fill="#7FD8C4" fill-opacity=".45"/><path d="M10 10 L25 190 L135 190 L150 10" fill="none" stroke="#E6F1EE" stroke-width="14" stroke-linejoin="round"/></svg>
      TapTest
    </a>
    <nav aria-label="Site">
      <a href="./" aria-current="page">Dashboard</a>
      <a href="slides/">Pitch</a>
      <a href="/docs" id="api-link" hidden>API</a>
    </nav>
    <p class="conn" id="conn" data-state="connecting" role="status"><span class="dot"></span><span id="conn-text">Connecting to the gateway</span></p>
  </header>

  <main>
    <section class="pour" aria-labelledby="pour-title">
      <div class="pour-head">
        <h1 id="pour-title">Latest pour</h1>
        <p id="pour-meta"></p>
      </div>
      <div class="pour-body">
        <figure class="cup-col" id="before"></figure>
        <div class="decision" id="decision" aria-live="polite"></div>
        <figure class="cup-col" id="after"></figure>
      </div>
    </section>

    <div class="network">
      <section class="map-panel" aria-labelledby="map-title">
        <div class="panel-head">
          <h2 id="map-title">Princeton network</h2>
          <ul class="legend">
            <li><span class="key key-measured"></span>Measured by a TapTest</li>
            <li><span class="key key-sim"></span>Simulated</li>
            <li><span class="key key-published"></span>Published (USGS, NJ DEP)</li>
          </ul>
        </div>
        <div id="map" role="region" aria-label="Map of monitoring sites around Princeton"></div>
      </section>

      <aside class="rail">
        <section class="panel" aria-labelledby="filters-title">
          <h2 id="filters-title">Filters</h2>
          <div id="filters"></div>
        </section>
        <section class="panel" aria-labelledby="report-title">
          <h2 id="report-title">Investigator report</h2>
          <div id="report" aria-live="polite"></div>
        </section>
      </aside>
    </div>

    <section class="feed" aria-labelledby="feed-title">
      <div class="panel-head">
        <h2 id="feed-title">Readings</h2>
        <label class="toggle"><input type="checkbox" id="show-sim" checked> Show simulated nodes</label>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Time</th>
              <th scope="col">Site</th>
              <th scope="col">Pour</th>
              <th scope="col" class="n">pH</th>
              <th scope="col" class="n">TDS ppm</th>
              <th scope="col" class="n">Clarity</th>
              <th scope="col">Verdict</th>
              <th scope="col" class="n">Unusual</th>
            </tr>
          </thead>
          <tbody id="feed"></tbody>
        </table>
      </div>
    </section>
  </main>

  <p class="toast" id="toast" role="status" hidden></p>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="assets/cup.js"></script>
  <script src="assets/demo.js"></script>
  <script src="assets/dashboard.js"></script>
</body>
</html>
